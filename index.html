<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ແບບທົດສອບຄວາມຮູ້ - English Grammar Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Phetsarath:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Phetsarath', sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        .container {
            background: transparent;
            border: none;
            width: 100%;
            height: 100vh;
            max-width: 100%;
            max-height: 100vh;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            backdrop-filter: none;
            overflow-y: auto;
            transition: all 0.4s ease;
        }

        .container.quiz-active-bg {
            background: #ffffff !important;
            color: #1e293b !important;
            border: 1px solid #cbd5e1 !important;
            width: 92% !important;
            max-width: 600px !important;
            height: auto !important;
            max-height: 92vh !important;
            border-radius: 16px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3) !important;
            padding: 18px !important;
            margin: auto !important;
        }

        /* Welcome Screen Animation */
        #welcome-screen {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.4);
            border: 3px solid #f43f5e;
            animation: spinLogo 1.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        @keyframes spinLogo {
            0% {
                transform: rotate(0deg) scale(0.5);
                opacity: 0;
            }
            100% {
                transform: rotate(360deg) scale(1);
                opacity: 1;
            }
        }

        .typing-line-1, .typing-line-2 {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            min-height: 32px;
            display: block;
            text-align: center;
        }

        .container.quiz-active-bg .typing-line-1 {
            color: #1e293b;
        }

        .typing-line-2 {
            margin-bottom: 25px;
            color: #f43f5e;
        }

        .typing-line-1 span, .typing-line-2 span {
            opacity: 0;
            display: inline-block;
            animation: fadeInChar 0.01s forwards;
        }

        @keyframes fadeInChar {
            to {
                opacity: 1;
            }
        }

        .btn-start {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 17px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Phetsarath', sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
            display: inline-block;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.6);
            background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
        }

        /* Custom Modal Overlay */
        #alert-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 0;
            animation: fadeInModal 0.3s ease;
        }

        .container.quiz-active-bg #alert-modal {
            border-radius: 16px;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #ffffff;
            color: #1e293b;
            text-align: center;
            padding: 30px 25px;
            width: 90%;
            max-width: 380px;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .modal-icon-container {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .icon-warning { background-color: #fef3c7; color: #d97706; }
        .icon-success { background-color: #dcfce7; color: #16a34a; }
        .icon-error { background-color: #fee2e2; color: #dc2626; }
        .icon-lock { background-color: #ede9fe; color: #7c3aed; }

        .modal-text {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 18px;
            outline: none;
            font-family: 'Phetsarath', sans-serif;
            transition: border-color 0.2s;
        }

        .modal-input:focus { border-color: #7c3aed; }

        .modal-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Phetsarath', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .modal-btn:hover { transform: translateY(-2px); }
        .btn-confirm { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: white; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
        .btn-cancel { background: #f1f5f9; color: #64748b; }

        /* Quiz Screen */
        #quiz-screen {
            display: none;
            width: 100%;
            text-align: left;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .category-badge {
            background-color: #f1f5f9;
            color: #0284c7;
            border: 1px solid #e2e8f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .question-counter {
            color: #64748b;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .question-text {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .options-list {
            list-style: none;
            margin-bottom: 12px;
        }

        .option-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            color: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-item:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-item.selected {
            background: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
            font-weight: bold;
        }

        .option-item.selected::after {
            content: '✔️';
            font-size: 15px;
            color: #16a34a;
            font-weight: 900;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }

        .btn {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Phetsarath', sans-serif;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(59, 130, 246, 0.3);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn .arrow-icon {
            font-size: 18px;
            line-height: 1;
            font-weight: 900;
        }

        .btn-secondary {
            background: #f8fafc !important;
            color: #334155 !important;
            border: 2px solid #94a3b8 !important;
            padding: 10px 16px;
            border-radius: 10px;
            margin-left: 0 !important;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .btn-secondary:hover {
            background: #f1f5f9 !important;
            border-color: #64748b !important;
            transform: translateY(-1px);
        }

        /* Result Screen Layout */
        #result-screen {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        #result-screen h2 {
            color: #1e293b;
            margin-bottom: 2px;
            font-size: 20px;
        }

        .score-summary {
            font-size: 14px;
            margin-bottom: 8px;
            color: #64748b;
        }

        .result-content-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        .chart-container {
            position: relative;
            width: 190px;   
            height: 190px;  
            margin: 0 auto;
        }

        .reward-box {
            padding: 8px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .reward-success { background-color: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
        .reward-medium { background-color: #fef9c3; color: #ca8a04; border: 1px solid #fef08a; }
        .reward-fail { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }

        .btn-restart {
            width: 100%;
            margin-left: 0;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- Custom Modal Popup -->
        <div id="alert-modal">
            <div class="modal-content" id="modal-box-content"></div>
        </div>

        <!-- 1. ໜ້າ Welcome -->
        <div id="welcome-screen">
            <div class="logo-container" onclick="handleLogoClick()">
                <img src="Image/Logo.jpg" alt="Logo" id="logo-img">
            </div>
            
            <div class="typing-line-1" id="line-1"></div>
            <div class="typing-line-2" id="line-2"></div>
            
            <button class="btn-start" onclick="startQuiz()">ເລີ່ມຕົ້ນທົດສອບ</button>
        </div>

        <!-- 2. ໜ້າ Quiz -->
        <div id="quiz-screen">
            <div class="quiz-header">
                <span class="category-badge" id="category-badge">ໝວດໝູ່</span>
                <span class="question-counter" id="question-counter">ຂໍ້ທີ່ 1 / 15</span>
            </div>
            
            <div class="question-text" id="question-text">ຄຳຖາມຢູ່ບ່ອນນີ້...</div>
            
            <ul class="options-list" id="options-list"></ul>
            
            <div class="quiz-footer">
                <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()"><span class="arrow-icon">&larr;</span> <span>ກັບຄືນ</span></button>
                <button class="btn" id="next-btn" onclick="nextQuestion()"><span>ຕໍ່ໄປ</span> <span class="arrow-icon">&rarr;</span></button>
            </div>
        </div>

        <!-- 3. ໜ້າ Result -->
        <div id="result-screen">
            <h2>ຜົນການທົດສອບຂອງທ່ານ</h2>
            <div class="score-summary" id="score-summary">ຄະແນນລວມ: 0 / 15 ຂໍ້</div>
            
            <div class="result-content-wrapper">
                <div class="chart-container">
                    <canvas id="resultChart"></canvas>
                </div>
            </div>

            <div id="reward-message" class="reward-box">ຂໍ້ຄວາມລາງວັນ</div>
            
            <button class="btn btn-restart" onclick="restartQuiz()">ກົດເພື່ອທົດສອບອີກຄັ້ງ</button>
        </div>
    </div>

    <script>
        const textLine1 = "ຍິນດີຕ້ອນຮັບເຂົ້າສູ່ການທົດສອບ";
        const textLine2 = "ພາສາອັງກິດ";
        
        function initTypewriter() {
            const el1 = document.getElementById('line-1');
            const el2 = document.getElementById('line-2');
            el1.innerHTML = '';
            el2.innerHTML = '';
            
            const totalChars = textLine1.length + textLine2.length;
            const targetDuration = 1750; 
            const delayPerChar = targetDuration / totalChars;
            
            let charIndex = 0;
            for (let i = 0; i < textLine1.length; i++) {
                const span = document.createElement('span');
                span.innerText = textLine1[i];
                span.style.animationDelay = `${charIndex * (delayPerChar / 1000)}s`;
                el1.appendChild(span);
                charIndex++;
            }
            
            for (let i = 0; i < textLine2.length; i++) {
                const span = document.createElement('span');
                span.innerText = textLine2[i];
                span.style.animationDelay = `${charIndex * (delayPerChar / 1000)}s`;
                el2.appendChild(span);
                charIndex++;
            }
        }

        window.onload = function() {
            initTypewriter();
        };
const questions = [
            // ໝວດທີ່ 1: Verb to do (ຂໍ້ 1-5)
            { 
                category: "Verb to do (ຂໍ້ 1-5)", 
                question: "1. My father _____ not drink coffee in the morning.", 
                options: ["do", "does", "did", "doing"], 
                answer: 1 // does (index 1)
            },
            { 
                category: "Verb to do (ຂໍ້ 1-5)", 
                question: "2. We _____ our homework after dinner every day.", 
                options: ["do", "does", "did", "done"], 
                answer: 0 // do (index 0)
            },
            { 
                category: "Verb to do (ຂໍ້ 1-5)", 
                question: "3. The little girl _____ not cry when she fell down.", 
                options: ["do", "does", "did", "done"], 
                answer: 2 // did (index 2)
            },
            { 
                category: "Verb to do (ຂໍ້ 1-5)", 
                question: "4. Students _____ their best to pass the final exam.", 
                options: ["do", "does", "did", "done"], 
                answer: 0 // do (index 0)
            },
            { 
                category: "Verb to do (ຂໍ້ 1-5)", 
                question: "5. She _____ a great job on her English project last week.", 
                options: ["do", "does", "did", "done"], 
                answer: 2 // did (index 2)
            },

            // ໝວດທີ່ 2: Verb to be (ຂໍ້ 6-10)
            { 
                category: "Verb to be (ຂໍ້ 6-10)", 
                question: "6. My mother _____ a teacher at a local school.", 
                options: ["am", "is", "are", "be"], 
                answer: 1 // is (index 1)
            },
            { 
                category: "Verb to be (ຂໍ້ 6-10)", 
                question: "7. Birds _____ flying high up in the blue sky now.", 
                options: ["am", "is", "are", "be"], 
                answer: 2 // are (index 2)
            },
            { 
                category: "Verb to be (ຂໍ້ 6-10)", 
                question: "8. I _____ very tired after running for an hour yesterday.", 
                options: ["am", "was", "were", "are"], 
                answer: 1 // was (index 1)
            },
            { 
                category: "Verb to be (ຂໍ້ 6-10)", 
                question: "9. The students _____ happy with their test results last Friday.", 
                options: ["was", "were", "are", "is"], 
                answer: 1 // were (index 1)
            },
            { 
                category: "Verb to be (ຂໍ້ 6-10)", 
                question: "10. Look at those clouds! It _____ going to rain soon.", 
                options: ["am", "is", "are", "be"], 
                answer: 1 // is (index 1)
            },

            // ໝວດທີ່ 3: Verb to have (ຂໍ້ 11-15) - ໃຊ້ມີ ແລະ ໃຊ້ກິນ/ດື່ມ
            { 
                category: "Verb to have (ຂໍ້ 11-15)", 
                question: "11. My brother _____ a bicycle to ride to school.", 
                options: ["has", "have", "had", "having"], 
                answer: 0 // has (index 0 - ຄວາມໝາຍ: ມີ)
            },
            { 
                category: "Verb to have (ຂໍ້ 11-15)", 
                question: "12. All the students _____ books to read in class.", 
                options: ["has", "have", "had", "having"], 
                answer: 1 // have (index 1 - ຄວາມໝາຍ: ມີ)
            },
            { 
                category: "Verb to have (ຂໍ້ 11-15)", 
                question: "13. Every morning, I _____ a cup of hot tea before work.", 
                options: ["has", "have", "had", "having"], 
                answer: 1 // have (index 1 - ຄວາມໝາຍ: ກິນ/ດື່ມ)
            },
            { 
                category: "Verb to have (ຂໍ້ 11-15)", 
                question: "14. Yesterday afternoon, they _____ sandwiches for lunch.", 
                options: ["has", "have", "had", "having"], 
                answer: 2 // had (index 2 - ຄວາມໝາຍ: ກິນໃນອະດີດ)
            },
            { 
                category: "Verb to have (ຂໍ້ 11-15)", 
                question: "15. We _____ a wonderful time at the party last night.", 
                options: ["has", "have", "had", "having"], 
                answer: 2 // had (index 2 - ຄວາມໝາຍ: ມີໃນອະດີດ)
            }
        ];

        let currentIdx = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let myChart = null;

        function startQuiz() {
            const hasCompleted = localStorage.getItem('quiz_completed');
            if (hasCompleted === 'true') {
                showModal('fa-triangle-exclamation', 'icon-warning', 'ກະລຸນາລໍຖ້າ<br>ການທົດສອບໃນຄັ້ງຕໍ່ໄປ');
                return;
            }

            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('main-container').classList.add('quiz-active-bg');
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            document.getElementById('category-badge').innerText = q.category;
            document.getElementById('question-counter').innerText = `ຂໍ້ທີ່ ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = q.question;

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            q.options.forEach((opt, index) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                if (userAnswers[currentIdx] === index) {
                    li.classList.add('selected');
                }
                li.innerText = `${String.fromCharCode(65 + index)}. ${opt}`;
                li.onclick = () => selectOption(index);
                optionsList.appendChild(li);
            });

            const prevBtn = document.getElementById('prev-btn');
            if (currentIdx === 0) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'inline-flex';
            }
            
            const nextBtn = document.getElementById('next-btn');
            if (currentIdx === questions.length - 1) {
                nextBtn.innerHTML = '<span>ສົ່ງຄຳຕອບ</span> <span class="arrow-icon">🚀</span>';
            } else {
                nextBtn.innerHTML = '<span>ຕໍ່ໄປ</span> <span class="arrow-icon">&rarr;</span>';
            }
        }

        function selectOption(index) {
            userAnswers[currentIdx] = index;
            loadQuestion();
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                localStorage.setItem('quiz_completed', 'true');
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            let correctCount = 0;
            let incorrectCount = 0;

            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) {
                    correctCount++;
                } else {
                    incorrectCount++;
                }
            });

            document.getElementById('score-summary').innerText = `ຄະແນນລວມ: ${correctCount} / ${questions.length} ຂໍ້`;

            const rewardBox = document.getElementById('reward-message');
            if (correctCount >= 13) {
                rewardBox.className = 'reward-box reward-success';
                rewardBox.innerText = '🎉 ຂໍສະແດງຄວາມຍິນດີ! ທ່ານໄດ້ຮັບລາງວັນ 10,000 ກີບ';
            } else if (correctCount >= 10 && correctCount <= 12) {
                rewardBox.className = 'reward-box reward-medium';
                rewardBox.innerText = '⭐ ຂໍສະແດງຄວາມຍິນດີ! ທ່ານໄດ້ຮັບລາງວັນ 5,000 ກີບ';
            } else {
                rewardBox.className = 'reward-box reward-fail';
                rewardBox.innerText = '❌ ຂໍສະແດງຄວາມເສຍໃຈນຳ ທ່ານບໍ່ຜ່ານການທົດສອບ!';
            }

            const ctx = document.getElementById('resultChart').getContext('2d');
            if (myChart) {
                myChart.destroy();
            }
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['ຖືກ', 'ຜິດ'],
                    datasets: [{
                        data: [correctCount, incorrectCount],
                        backgroundColor: ['#22c55e', '#ef4444'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            align: 'center',
                            labels: {
                                color: '#1e293b',
                                font: {
                                    family: 'Phetsarath',
                                    size: 12
                                },
                                boxWidth: 10,
                                padding: 8
                            }
                        }
                    }
                }
            });
        }

        function showModal(iconClass, iconBgClass, msgText, customBtnText = 'ຕົກລົງ', customAction = 'closeAndReload()') {
            const modal = document.getElementById('alert-modal');
            const boxContent = document.getElementById('modal-box-content');

            boxContent.innerHTML = `
                <div class="modal-icon-container ${iconBgClass}">
                    <i class="fa-solid ${iconClass}"></i>
                </div>
                <div class="modal-text">${msgText}</div>
                <button class="modal-btn btn-confirm" onclick="${customAction}">${customBtnText}</button>
            `;
            modal.style.display = 'flex';
        }

        function restartQuiz() {
            showModal('fa-triangle-exclamation', 'icon-warning', 'ກະລຸນາລໍຖ້າ<br>ການທົດສອບຄັ້ງຕໍ່ໄປ');
        }

        let logoClickCount = 0;
        let clickTimer = null;

        function handleLogoClick() {
            logoClickCount++;
            
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => {
                logoClickCount = 0;
            }, 1000);

            if (logoClickCount === 3) {
                logoClickCount = 0;
                openAdminModal();
            }
        }

        function openAdminModal() {
            const modal = document.getElementById('alert-modal');
            const boxContent = document.getElementById('modal-box-content');

            boxContent.innerHTML = `
                <div class="modal-icon-container icon-lock">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="modal-text">ກະລຸນາໃສ່ລະຫັດຜ່ານ<br>ເພື່ອອັບເດດຂໍ້ມູນ:</div>
                <input type="password" id="admin-pass-input" class="modal-input" placeholder="ລະຫັດຜ່ານ..." autofocus>
                <div class="modal-btn-group">
                    <button class="modal-btn btn-cancel" onclick="closeAdminModal()">ຍົກເລີກ</button>
                    <button class="modal-btn btn-confirm" onclick="verifyAdminPass()">ຕົກລົງ</button>
                </div>
            `;
            modal.style.display = 'flex';

            setTimeout(() => {
                const inputEl = document.getElementById('admin-pass-input');
                if(inputEl) {
                    inputEl.focus();
                    inputEl.onkeydown = function(e) {
                        if (e.key === 'Enter') verifyAdminPass();
                    };
                }
            }, 100);
        }

        function closeAdminModal() {
            document.getElementById('alert-modal').style.display = 'none';
        }

        function closeAndReload() {
            document.getElementById('alert-modal').style.display = 'none';
            location.reload();
        }

        function verifyAdminPass() {
            const inputEl = document.getElementById('admin-pass-input');
            const password = inputEl ? inputEl.value : '';

            if (password === "admin") {
                localStorage.removeItem('quiz_completed');
                showModal('fa-circle-check', 'icon-success', 'ອັບເດດຂໍ້ມູນສຳເລັດແລ້ວ!<br>ເລີ່ມການທົດສອບໃໝ່ໄດ້ເລີຍ');
            } else {
                /* ປັບຂໍ້ຄວາມແຈ້ງເຕືອນລະຫັດຜ່ານຜິດເປັນ 2 ແຖວ ແລະ ຈັດເຄິ່ງກາງ */
                showModal('fa-xmark', 'icon-error', 'ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ!<br>ກະລຸນາລອງໃໝ່ອີກຄັ້ງ', 'ລອງໃໝ່', 'openAdminModal()');
            }
        }
    </script>
</body>
</html>
